
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>User Information Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #d5d9e5;
        }

        h2 {
            margin-top: 0;
            color: #111;
        }

        p {
            color: #747b8c;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #dce0e8;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .gender {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .gender label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
        }

        .gender input {
            width: auto;
        }

        small {
            color: #747b8c;
        }

        .buttons {
            text-align: right;
            margin-top: 25px;
        }

        button {
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .reset {
            background: white;
            color: #2563eb;
            border: 1px solid #dce0e8;
        }

        .submit {
            background: #2563eb;
            color: white;
            border: none;
        }

        button:hover {
            opacity: 0.85;
        }

        @media(max-width: 550px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            body {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>User Information Form</h2>

    <p>Enter name, gender, contact and location.
       We'll show these on the next page.</p>

    <form onsubmit="saveData(event)">

        <div class="form-group">
            <label>Full name *</label>
            <input type="text" id="name"
                   placeholder="e.g. Priya Sharma" required>
        </div>

        <div class="form-row">

            <div class="form-group">
                <label>Gender *</label>

                <div class="gender">
                    <label>
                        <input type="radio" name="gender"
                               value="Female" required> Female
                    </label>

                    <label>
                        <input type="radio" name="gender"
                               value="Male"> Male
                    </label>

                    <label>
                        <input type="radio" name="gender"
                               value="Non-binary"> Non-binary
                    </label>

                    <label>
                        <input type="radio" name="gender"
                               value="Prefer not to say">
                        Prefer not to say
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Mobile number *</label>
                <input type="tel" id="mobile"
                       placeholder="+91xxxxxxxxxx"
                       pattern="[+]?[0-9]{7,15}" required>

                <small>Accepts digits and optional leading + (7–15 digits).</small>
            </div>

        </div>

        <div class="form-row">

            <div class="form-group">
                <label>Email address *</label>
                <input type="email" id="email"
                       placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label>City *</label>
                <input type="text" id="city"
                       placeholder="City name" required>
            </div>

        </div>

        <div class="form-row">

            <div class="form-group">
                <label>State / Province *</label>
                <input type="text" id="state"
                       placeholder="State or province" required>
            </div>

            <div></div>

        </div>

        <div class="form-group">
            <label>Country *</label>

            <select id="country" required>
                <option value="">Select country</option>
                <option>India</option>
                <option>United States</option>
                <option>United Kingdom</option>
                <option>Canada</option>
                <option>Australia</option>
                <option>Germany</option>
                <option>France</option>
                <option>Italy</option>
                <option>Japan</option>
                <option>Other</option>
            </select>
        </div>

        <div class="buttons">

            <button type="reset" class="reset">
                Reset
            </button>

            <button type="submit" class="submit">
                Continue →
            </button>

        </div>

    </form>

</div>

<script>

function saveData(event) {

    event.preventDefault();

    let gender = document.querySelector(
        'input[name="gender"]:checked'
    ).value;

    localStorage.setItem("name",
        document.getElementById("name").value);

    localStorage.setItem("gender", gender);

    localStorage.setItem("mobile",
        document.getElementById("mobile").value);

    localStorage.setItem("email",
        document.getElementById("email").value);

    localStorage.setItem("city",
        document.getElementById("city").value);

    localStorage.setItem("state",
        document.getElementById("state").value);

    localStorage.setItem("country",
        document.getElementById("country").value);

    window.location.href = "display.html";
}

</script>

</body>
</html>
